name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create placeholder appsettings.json      
        run: |
          echo '{
            "ConnectionStrings": {
              "DevelopmentConnection": "Host=localhost;Username=ci;Password=ci;Database=rentalapp"
            }
          }' > RentalApp.Database/appsettings.json

      - name: Restore dependencies
        run: dotnet restore RentalApp.Database/RentalApp.Database.csproj

      - name: Build
        run: dotnet build RentalApp.Database/RentalApp.Database.csproj --no-restore

      - name: Run tests with coverage
        run: dotnet test RentalApp.Test/RentalApp.Test.csproj --collect:"XPlat Code Coverage" --settings RentalApp.Test/test.runsettings
