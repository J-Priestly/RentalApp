version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rentalapp_db
    environment:
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rentalapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_user -d rentalapp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
